<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta id="theme-color" name="theme-color" content="#16191B">
  <meta id="theme-dark" name="theme-color" content="#16191B" media="(prefers-color-scheme: dark)">
  <meta id="theme-light" name="theme-color" content="#F1F3F4" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>筋トレ記録</title>
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script>
    (() => {
      // 初回描画の前に読み、以後の書き込みもテーマ専用のこの窓口だけで行う。
      const cache = value => {
        try {
          const storage = window.localStorage;
          if (value === undefined) return storage.getItem('gym-log-theme');
          storage.setItem('gym-log-theme', value);
        } catch (error) {
          // キャッシュ不可でもIndexedDBを正として使えるため起動は続ける。
          console.error(error);
        }
      };
      const theme = cache();
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      const dark = theme === 'dark' || theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches;
      document.getElementById('theme-color').content = document.getElementById(dark ? 'theme-dark' : 'theme-light').content;
      document.addEventListener('theme-cache', event => {
        if (['system', 'dark', 'light'].includes(event.detail)) cache(event.detail);
      });
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 11L12 3L21 11M5 10V21H10V15H14V21H19V10"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><path d="M12 3A9 9 0 1 0 12 21A9 9 0 1 0 12 3M12 7V12L16 14"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M9 3H15L16 6L19 7L21 10V14L18 16L17 19L14 21H10L8 18L5 17L3 14V10L6 8L7 5ZM12 8A4 4 0 1 0 12 16A4 4 0 1 0 12 8"/></symbol>
    <symbol id="icon-add" viewBox="0 0 24 24"><path d="M12 5V19M5 12H19"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 9L12 15L18 9"/></symbol>
    <symbol id="icon-previous" viewBox="0 0 24 24"><path d="M15 6L9 12L15 18"/></symbol>
    <symbol id="icon-forward" viewBox="0 0 24 24"><path d="M9 6L15 12L9 18"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><path d="M10 3A7 7 0 1 0 10 17A7 7 0 1 0 10 3M15 15L21 21"/></symbol>
    <symbol id="icon-note" viewBox="0 0 24 24"><path d="M4 20L5 15L16 4L20 8L9 19ZM14 6L18 10"/></symbol>
    <symbol id="icon-delete" viewBox="0 0 24 24"><path d="M4 6H20M9 6V3H15V6M6 6L7 21H17L18 6M10 10V17M14 10V17"/></symbol>
    <symbol id="icon-weight" viewBox="0 0 24 24"><path d="M4 4V20H21M7 14L11 10L15 12L20 6"/></symbol>
    <symbol id="icon-chest" viewBox="0 0 24 24"><path d="M3 7L10 5L12 8L14 5L21 7L19 16L13 18L12 15L11 18L5 16ZM12 8V15"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="M4 5H20L17 15L12 20L7 15ZM12 5V20M7 10H17"/></symbol>
    <symbol id="icon-shoulders" viewBox="0 0 24 24"><path d="M3 13L6 6H10L12 10L14 6H18L21 13M6 6V18M18 6V18M6 13H18"/></symbol>
    <symbol id="icon-legs" viewBox="0 0 24 24"><path d="M6 3H18L17 12L20 21H14L12 13L10 21H4L7 12ZM12 3V13"/></symbol>
  </defs></svg>

  <div id="app-shell"><header id="app-header" class="app-header"></header>
  <main id="app-content"><p id="error" role="alert" hidden></p><section id="view-home"><h1>筋トレ記録</h1></section><section id="view-settings" hidden></section><section id="view-history" hidden></section></main>
  <aside id="mini-bar" hidden></aside>
  <nav id="tab-bar" aria-label="メインナビゲーション"></nav></div>
  <section id="session-overlay" aria-label="トレーニング記録" hidden><header id="session-header" class="app-header"></header><div class="session-scroll"><p id="session-error" role="alert" hidden></p><section id="view-session" hidden></section></div></section>
  <template id="tpl-set-row"><div class="set-row"></div></template>
  <template id="tpl-prev-set-row"><button class="previous" type="button"></button></template>
  <template id="tpl-exercise-card"><article class="card"></article></template>
  <template id="tpl-history-row"><button class="history" type="button"></button></template>
  <dialog id="dlg-body-weight" class="sheet"></dialog><dialog id="dlg-exercise-picker" class="sheet"></dialog><dialog id="dlg-confirm"></dialog><dialog id="dlg-editor" class="sheet"></dialog><dialog id="dlg-exercise" class="detail-page"></dialog><dialog id="dlg-summary" class="sheet summary"></dialog><dialog id="dlg-set" class="sheet"></dialog><dialog id="dlg-rest" class="sheet"></dialog><dialog id="dlg-history" class="sheet"></dialog>
</body>
</html>
